@if (dialog.state(); as s) {
  @if (s.open) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" (click)="dialog.resolve(false)">
      <div
        class="w-full max-w-sm rounded-lg bg-surface-container p-5 shadow-popover"
        (click)="$event.stopPropagation()"
      >
        <h2 class="text-base font-semibold">{{ s.title }}</h2>
        <p class="mt-2 text-sm text-on-surface-variant">{{ s.message }}</p>
        <div class="mt-5 flex justify-end gap-2">
          <button
            type="button"
            (click)="dialog.resolve(false)"
            class="rounded border border-border px-3 py-1.5 text-xs font-semibold hover:bg-surface-container-high"
          >
            {{ s.cancelText }}
          </button>
          <button
            type="button"
            (click)="dialog.resolve(true)"
            class="rounded px-3 py-1.5 text-xs font-semibold text-on-primary"
            [class.bg-danger]="s.danger"
            [class.bg-primary]="!s.danger"
          >
            {{ s.confirmText }}
          </button>
        </div>
      </div>
    </div>
  }
}
