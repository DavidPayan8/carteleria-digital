<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Playlists</h1>
    <p class="text-sm text-on-surface-variant">Secuencias de contenido para tus pantallas.</p>
  </div>
  <button
    (click)="showForm.set(!showForm())"
    class="rounded bg-primary px-3 py-2 text-xs font-semibold text-on-primary hover:opacity-90"
  >
    + Nueva playlist
  </button>
</div>

@if (showForm()) {
  <form (ngSubmit)="create()" class="mb-6 flex items-end gap-3 rounded-lg border border-border bg-surface-container p-4">
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Nombre</label>
      <input [(ngModel)]="name" name="name" required placeholder="Campaña Verano" class="rounded border border-border px-3 py-2 text-sm" />
    </div>
    <label class="flex items-center gap-2 pb-2 text-xs text-on-surface-variant">
      <input type="checkbox" [(ngModel)]="scopeToLocation" name="scopeToLocation" />
      Solo para {{ workspace.selectedLocation()?.name }} (desmarca para plantilla de toda la organización)
    </label>
    <button type="submit" class="rounded bg-primary px-3 py-2 text-xs font-semibold text-on-primary">Crear</button>
  </form>
}

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  @for (playlist of playlists(); track playlist.id) {
    <div class="rounded-lg border border-border bg-surface-container p-4">
      <div class="flex items-start justify-between">
        <a [routerLink]="['/playlists', playlist.id]" class="font-medium hover:underline">{{ playlist.name }}</a>
        <button (click)="remove(playlist.id)" class="text-xs font-medium text-danger hover:underline">Borrar</button>
      </div>
      <p class="mt-1 text-xs text-on-surface-variant">
        {{ playlist.locationId ? "Restaurante específico" : "Plantilla de organización" }}
      </p>
      <a [routerLink]="['/playlists', playlist.id]" class="mt-3 inline-block text-xs font-medium text-accent hover:underline">
        Editar contenido →
      </a>
    </div>
  } @empty {
    <p class="col-span-full py-10 text-center text-sm text-on-surface-variant">Sin playlists todavía.</p>
  }
</div>
