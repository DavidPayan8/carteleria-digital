<div class="mb-6">
  <h1 class="text-2xl font-semibold tracking-tight">Mi cuenta</h1>
  <p class="text-sm text-on-surface-variant">{{ auth.user()?.email }}</p>
</div>

<div class="max-w-sm rounded-lg border border-border bg-surface-container p-4">
  <h2 class="mb-3 text-sm font-semibold">Cambiar contraseña</h2>

  @if (success()) {
    <p class="mb-3 text-xs text-success">Contraseña actualizada correctamente.</p>
  }
  @if (error(); as e) {
    <p class="mb-3 text-xs text-danger">{{ e }}</p>
  }

  <form (ngSubmit)="submit()" class="space-y-3">
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Contraseña actual</label>
      <input
        type="password"
        [(ngModel)]="currentPassword"
        name="currentPassword"
        required
        class="w-full rounded border border-border px-3 py-2 text-sm"
      />
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Nueva contraseña</label>
      <input
        type="password"
        [(ngModel)]="newPassword"
        name="newPassword"
        required
        minlength="8"
        class="w-full rounded border border-border px-3 py-2 text-sm"
      />
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Repetir nueva contraseña</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        minlength="8"
        class="w-full rounded border border-border px-3 py-2 text-sm"
      />
    </div>
    <button
      type="submit"
      [disabled]="saving()"
      class="rounded bg-primary px-3 py-2 text-xs font-semibold text-on-primary disabled:opacity-50"
    >
      {{ saving() ? "Guardando..." : "Cambiar contraseña" }}
    </button>
  </form>
</div>
