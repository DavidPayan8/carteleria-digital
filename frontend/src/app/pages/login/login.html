<div class="flex min-h-screen items-center justify-center bg-surface">
  <div class="w-full max-w-sm rounded-lg border border-border bg-surface-container p-8 shadow-popover">
    <div class="mb-6 flex items-center gap-2">
      <div class="flex h-8 w-8 items-center justify-center rounded bg-primary text-white font-bold">S</div>
      <div>
        <div class="text-sm font-semibold leading-tight">SignageFlow</div>
        <div class="text-xs text-on-surface-variant leading-tight">Cartelería Digital</div>
      </div>
    </div>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="mb-1 block text-xs font-medium text-on-surface-variant">Email</label>
        <input
          type="email"
          name="email"
          required
          [(ngModel)]="email"
          class="w-full rounded border border-border px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20"
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-on-surface-variant">Contraseña</label>
        <input
          type="password"
          name="password"
          required
          [(ngModel)]="password"
          class="w-full rounded border border-border px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20"
        />
      </div>

      @if (error()) {
        <p class="text-xs text-danger">{{ error() }}</p>
      }
      @if (isRateLimited()) {
        <p class="text-xs text-warning">Podrás volver a intentarlo en {{ retryLabel() }}.</p>
      }

      <button
        type="submit"
        [disabled]="loading() || isRateLimited()"
        class="w-full rounded bg-primary px-3 py-2 text-sm font-semibold text-on-primary hover:opacity-90 disabled:opacity-50"
      >
        {{ isRateLimited() ? "Espera " + retryLabel() : loading() ? "Entrando..." : "Entrar" }}
      </button>
    </form>
  </div>
</div>
