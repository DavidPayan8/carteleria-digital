<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Restaurantes</h1>
    <p class="text-sm text-on-surface-variant">Locales de {{ workspace.selectedOrganization()?.name }}.</p>
  </div>
  <button
    (click)="showForm.set(!showForm())"
    class="rounded bg-primary px-3 py-2 text-xs font-semibold text-on-primary hover:opacity-90"
  >
    + Nuevo restaurante
  </button>
</div>

@if (showForm()) {
  <form (ngSubmit)="create()" class="mb-6 flex items-end gap-3 rounded-lg border border-border bg-surface-container p-4">
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Nombre</label>
      <input [(ngModel)]="name" name="name" required class="rounded border border-border px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Dirección</label>
      <input [(ngModel)]="address" name="address" class="rounded border border-border px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-on-surface-variant">Zona horaria</label>
      <input [(ngModel)]="timeZone" name="timeZone" class="rounded border border-border px-3 py-2 text-sm" />
    </div>
    <button type="submit" class="rounded bg-primary px-3 py-2 text-xs font-semibold text-on-primary">Crear</button>
  </form>
}

<div class="overflow-hidden rounded-lg border border-border bg-surface-container">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-border bg-surface-container-high text-xs font-semibold uppercase tracking-wide text-on-surface-variant">
      <tr>
        <th class="px-4 py-2">Nombre</th>
        <th class="px-4 py-2">Dirección</th>
        <th class="px-4 py-2">Zona horaria</th>
        <th class="px-4 py-2"></th>
      </tr>
    </thead>
    <tbody>
      @for (loc of locations(); track loc.id) {
        <tr class="border-b border-border last:border-0 hover:bg-surface-container-high">
          <td class="px-4 py-2 font-medium">{{ loc.name }}</td>
          <td class="px-4 py-2 text-on-surface-variant">{{ loc.address || "—" }}</td>
          <td class="px-4 py-2 font-mono text-xs text-on-surface-variant">{{ loc.timeZone }}</td>
          <td class="px-4 py-2 text-right">
            <button (click)="remove(loc.id)" class="text-xs font-medium text-danger hover:underline">Borrar</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4" class="px-4 py-6 text-center text-on-surface-variant">Sin restaurantes todavía.</td></tr>
      }
    </tbody>
  </table>
</div>
